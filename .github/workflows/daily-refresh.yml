# Daily data refresh: re-scrape the program API, geocode any new restaurants
# (detail-page coordinates with a Nominatim name-search fallback), commit the
# updated data, and redeploy to Vercel.
#
# Requires one repo secret: VERCEL_TOKEN (create at vercel.com/account/tokens,
# add under Settings → Secrets and variables → Actions).
name: daily-refresh

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC (~4-5am New York)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Scrape program API (preserves existing coordinates)
        run: npm run scrape
      - name: Geocode new restaurants
        run: npm run geocode
      - name: Commit data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/restaurants.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git add data/restaurants.json
            git commit -m "Daily data refresh: restaurants + geocoding"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_gbov9DBySawsDmV9bBOAKSBw
          VERCEL_PROJECT_ID: prj_WGlL1b22nBDF7F7cH2uq1MiCAtiD
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
