# Daily data refresh: re-scrape the program API, geocode any new restaurants
# (detail-page coordinates with a Nominatim name-search fallback), and commit
# the updated data.
#
# No deploy step needed: Vercel's Git integration builds production on every
# push to main, so the commit below is what ships the new data.
name: daily-refresh

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC (~4-5am New York)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Scrape program API (preserves existing coordinates)
        run: npm run scrape
      - name: Geocode new restaurants
        run: npm run geocode
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/restaurants.json; then
            echo "No data changes."
          else
            git add data/restaurants.json
            git commit -m "Daily data refresh: restaurants + geocoding"
            git push
          fi
      # A failed refresh is silent otherwise (site keeps serving last-good
      # data). File/bump an issue so it shows up in GitHub notifications —
      # most likely cause: NYC Tourism rotated the API key or changed the API.
      - name: File an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search '"Daily data refresh failing" in:title' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Refresh failed again: $run_url"
          else
            gh issue create --title "Daily data refresh failing" \
              --body "The scheduled data refresh failed. See the run: $run_url

          Likely causes: NYC Tourism rotated the embedded API key, changed the program API response shape, or Nominatim geocoding is down. The site keeps serving the last committed data in the meantime."
          fi
